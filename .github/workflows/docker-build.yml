name: Docker build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --progress=plain \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.19 \
            --tag cbus2ha-event-test:local .
      - name: Offline smoke test
        shell: bash
        run: |
          help_output="$(docker run --rm --network none \
            --entrypoint python3 cbus2ha-event-test:local \
            -m cbus.daemon.cmqttd --help)"
          printf '%s\n' "$help_output"
          grep -F -- '--lighting-events' <<< "$help_output"

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        paho: ['1.5.0', '1.6.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install parameterized==0.9.0 paho-mqtt==${{ matrix.paho }} six==1.17.0 pyserial==3.5 pyserial-asyncio==0.6
      - name: Run regression tests
        run: python -m unittest -v

  connection-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install parameterized==0.9.0 paho-mqtt==1.6.1 six==1.17.0 pyserial==3.5 pyserial-asyncio==0.6
      - name: Run loopback MQTT and simulated CNI failure tests
        run: CBUS_INTEGRATION=1 python -m unittest -v tests.test_reliability_integration
